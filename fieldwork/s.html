const T={

 es:{loading:'Cargando…',invalid:'Este enlace no es válido o ha caducado.',customer:'Cliente',address:'Dirección',date:'Fecha de trabajo',notes:'Detalle del trabajo',checks:'Lista de comprobación',issues:'Defectos y acciones',photos:'Fotos',done:'Hecho',open:'Pendiente',fixed:'Resuelto',pending:'Requiere acción',request:'Solicitud de foto',upload:'Enviar una foto',sending:'Enviando…',sent:'Foto enviada. ¡Gracias!',fail:'No se pudo enviar. Inténtalo de nuevo.',limit:'Límite de subidas alcanzado.',expires:'El enlace caduca',before:'Antes',during:'Durante',after:'Después',quote:'Presupuesto',extra:'Trabajo adicional',paid:'Pagado',note:'Las fotos solo se comparten mediante este enlace privado.'},

};
const lang=(navigator.language||'en').toLowerCase();
const L=T[Object.keys(T).find(k=>lang.startsWith(k))||'en'];
const app=document.getElementById('app'),token=new URLSearchParams(location.search).get('t')||'';
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function section(title){app.append(el('h2',title))}
async function load(){
 if(!/^[a-f0-9]{32}$/.test(token)){app.replaceChildren(el('p',L.invalid,'err'));return}
 let r;try{r=await fetch(API+'?t='+token)}catch{app.replaceChildren(el('p',L.fail,'err'));return}
 if(!r.ok){app.replaceChildren(el('p',L.invalid,'err'));return}
 render(await r.json())}
function render(d){
 const j=d.job;app.replaceChildren(el('h1',j.name||'Fieldwork'));
 app.append(el('p',[j.kind,j.workDate].filter(Boolean).join(' · '),'muted'));
 app.append(el('p',L.expires+': '+new Date(d.expires_at).toLocaleDateString(),'muted'));
 const info=el('div',undefined,'card');
 if(j.customer)info.append(el('div',L.customer+': '+j.customer));
 if(j.address)info.append(el('div',L.address+': '+j.address));
 if(j.quoteAmount)info.append(el('div',L.quote+': '+j.quoteAmount));
 if(j.extraAmount)info.append(el('div',L.extra+': '+j.extraAmount));
 if(j.paidAmount)info.append(el('div',L.paid+': '+j.paidAmount));
 if(info.childNodes.length)app.append(info);
 if(j.notes){section(L.notes);app.append(el('p',j.notes))}
 if((j.checks||[]).length){section(L.checks);const ul=el('ul');j.checks.forEach((c,i)=>ul.append(el('li',(j.done[i]?'✓ ':'○ ')+c)));app.append(ul)}
 if((j.issues||[]).length){section(L.issues);const ul=el('ul');j.issues.forEach((c,i)=>ul.append(el('li',(j.resolved[i]?L.fixed:L.pending)+' · '+c)));app.append(ul)}
 if((j.photos||[]).length){section(L.photos);j.photos.forEach(p=>{const u=d.photoUrls[p.blob];if(!u)return;const c=el('div',undefined,'card');c.append(el('div',(p.target||'')+' · '+(L[p.stage]||p.stage)+(p.caption?' · '+p.caption:''),'muted'));const i=document.createElement('img');i.src=u;i.loading='lazy';i.alt=p.caption||'';c.append(i);app.append(c)})}
 if(d.allow_upload){section(L.request);const c=el('div',undefined,'card');
  if(d.request_target)c.append(el('div',d.request_target));if(d.request_note)c.append(el('div',d.request_note));
  const input=document.createElement('input');input.type='file';input.accept='image/*';input.id='f';input.hidden=true;
  const lab=el('label',L.upload,'btn');lab.htmlFor='f';const msg=el('p',undefined,'muted');
  input.onchange=async()=>{const f=input.files[0];if(!f)return;msg.className='muted';msg.textContent=L.sending;
   try{const blob=await toJpeg(f);const r=await fetch(API+'?t='+token,{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob});
    if(r.status===429){msg.className='err';msg.textContent=L.limit}else if(!r.ok)throw 0;else{msg.className='ok';msg.textContent=L.sent}}
   catch{msg.className='err';msg.textContent=L.fail}input.value=''};
  c.append(lab,input,msg);app.append(c)}
 app.append(el('p',L.note,'muted'))}
function toJpeg(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
 img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b&&b.size<=5*1024*1024?res(b):rej(),'image/jpeg',.85)};
 img.onerror=()=>rej();img.src=url})}
document.getElementById('status').textContent=L.loading;load();
</script></body></html>
